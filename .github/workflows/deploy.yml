name: React CI CD
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build production app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ANALYTICS_ID: ${{ secrets.REACT_APP_ANALYTICS_ID }}
          REACT_APP_ENV: ${{ secrets.REACT_APP_ENV }}
      - uses: actions/upload-artifact@v4
        with:
          name: react-build-and-coverage
          path: |
            dist
            coverage
          retention-days: 7
  deploy-staging:
    if: vars.NETLIFY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: react-build-and-coverage
          path: output
      - uses: nwtgck/actions-netlify@v3.0
        id: netlify
        with:
          publish-dir: output/dist
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Staging ${{ github.sha }}"
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Slack result
        if: always() && vars.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "staging | ${{ job.status }} | ${{ github.sha }} | ${{ github.actor }} | ${{ steps.netlify.outputs.deploy-url }}"
  deploy-production:
    if: vars.NETLIFY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: react-build-and-coverage
          path: output
      - uses: nwtgck/actions-netlify@v3.0
        id: netlify
        with:
          publish-dir: output/dist
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production ${{ github.sha }}"
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Slack result
        if: always() && vars.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "production | ${{ job.status }} | ${{ github.sha }} | ${{ github.actor }} | ${{ steps.netlify.outputs.deploy-url }}"
      - name: Read package version
        id: version
        run: node -e 'console.log("version="+require("./package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            output/dist/**
            output/coverage/**
